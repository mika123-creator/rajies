<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sharp Style — Admin Portal</title>
  <meta name="robots" content="noindex, nofollow" />
  
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#ffffff',
              primaryHover: '#e5e7eb',
              dark: '#0a0a0a',
              darker: '#050505',
              card: '#121212',
              cardBorder: '#333333',
              whatsapp: '#25D366'
            }
          },
          fontFamily: {
            heading: ['Oswald', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['Inter', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-darker text-gray-100 font-sans antialiased min-h-screen">

  <!-- ================= LOGIN SCREEN ================= -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-brand-darker">
    <div class="w-full max-w-md bg-brand-card border border-brand-cardBorder rounded-sm p-8 shadow-2xl relative">
      <div class="w-14 h-14 rounded-sm bg-white text-black font-heading font-black text-2xl flex items-center justify-center mx-auto mb-6">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <h1 class="text-3xl font-heading font-bold text-center text-white uppercase tracking-wider">Sharp Style Admin</h1>
      <p class="text-sm text-gray-400 text-center mt-1">Management Portal</p>

      <form id="loginForm" onsubmit="handleLogin(event)" class="mt-8 space-y-5">
        <div>
          <label class="block text-xs font-heading uppercase tracking-widest text-gray-300 mb-2">Access Password</label>
          <div class="relative">
            <input 
              type="password" 
              id="passwordInput" 
              required 
              placeholder="Enter master password" 
              class="w-full px-4 py-3.5 rounded-sm bg-brand-dark border border-brand-cardBorder text-white placeholder-gray-600 focus:outline-none focus:border-white text-sm transition-colors"
            />
          </div>
          <p id="loginError" class="hidden text-xs text-red-400 mt-2 flex items-center gap-1">
            <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> Incorrect password. Please try again.
          </p>
        </div>

        <button 
          type="submit" 
          class="w-full py-3.5 rounded-sm bg-white hover:bg-gray-200 text-black font-heading font-bold text-sm tracking-widest uppercase transition-all flex items-center justify-center gap-2"
        >
          <span>Enter Dashboard</span>
        </button>
      </form>
    </div>
  </div>

  <!-- ================= AUTHENTICATED DASHBOARD ================= -->
  <div id="adminDashboard" class="hidden min-h-screen flex flex-col">
    
    <!-- Top Bar -->
    <header class="h-16 bg-brand-darker border-b border-brand-cardBorder px-4 sm:px-8 flex items-center justify-between sticky top-0 z-40">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-sm bg-white text-black font-heading font-bold text-base flex items-center justify-center uppercase">
          S
        </div>
        <span class="font-heading font-bold uppercase tracking-wider text-sm sm:text-base text-white">Sharp Style Admin</span>
        <span class="hidden sm:inline-block px-2.5 py-1 rounded-sm text-[10px] font-bold bg-green-500/10 text-green-400 border border-green-500/20">Active Session</span>
      </div>

      <div class="flex items-center gap-3">
        <a href="index.html" target="_blank" class="px-4 py-2 rounded-sm bg-brand-card hover:bg-brand-cardBorder border border-brand-cardBorder text-xs font-semibold text-gray-200 flex items-center gap-2 transition-colors">
          <i data-lucide="external-link" class="w-3.5 h-3.5 text-white"></i>
          <span class="font-heading uppercase tracking-wider">Live Site</span>
        </a>
        <button onclick="handleLogout()" class="px-4 py-2 rounded-sm bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-xs font-semibold text-red-400 flex items-center gap-2 transition-colors">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span class="font-heading uppercase tracking-wider">Sign Out</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      
      <!-- Feedback Banner -->
      <div id="saveToast" class="fixed bottom-6 right-6 bg-white text-black px-5 py-3 rounded-sm font-bold text-sm shadow-2xl flex items-center gap-2 transform translate-y-24 opacity-0 transition-all duration-300 z-50">
        <i data-lucide="check-circle-2" class="w-5 h-5"></i>
        <span>Changes saved & published!</span>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto pb-4 border-b border-brand-cardBorder mb-8 text-xs font-heading uppercase tracking-wider">
        <button onclick="switchTab('tab-general')" class="tab-btn px-4 py-2.5 rounded-sm bg-white text-black font-bold transition-all" data-tab="tab-general">
          Business Details
        </button>
        <button onclick="switchTab('tab-services')" class="tab-btn px-4 py-2.5 rounded-sm bg-brand-card hover:bg-brand-cardBorder text-gray-300 transition-all border border-brand-cardBorder" data-tab="tab-services">
          Services
        </button>
        <button onclick="switchTab('tab-gallery')" class="tab-btn px-4 py-2.5 rounded-sm bg-brand-card hover:bg-brand-cardBorder text-gray-300 transition-all border border-brand-cardBorder" data-tab="tab-gallery">
          Gallery
        </button>
        <button onclick="switchTab('tab-hours')" class="tab-btn px-4 py-2.5 rounded-sm bg-brand-card hover:bg-brand-cardBorder text-gray-300 transition-all border border-brand-cardBorder" data-tab="tab-hours">
          Hours
        </button>
        <button onclick="switchTab('tab-content')" class="tab-btn px-4 py-2.5 rounded-sm bg-brand-card hover:bg-brand-cardBorder text-gray-300 transition-all border border-brand-cardBorder" data-tab="tab-content">
          Copy
        </button>
        <button onclick="switchTab('tab-security')" class="tab-btn px-4 py-2.5 rounded-sm bg-brand-card hover:bg-brand-cardBorder text-gray-300 transition-all border border-brand-cardBorder" data-tab="tab-security">
          Security
        </button>
        <button onclick="switchTab('tab-backup')" class="tab-btn px-4 py-2.5 rounded-sm bg-brand-card hover:bg-brand-cardBorder text-gray-300 transition-all border border-brand-cardBorder" data-tab="tab-backup">
          Backup
        </button>
      </div>

      <!-- TAB 1: BUSINESS DETAILS -->
      <div id="tab-general" class="tab-content space-y-6">
        <div class="bg-brand-card rounded-sm border border-brand-cardBorder p-6">
          <h2 class="text-2xl font-heading font-bold uppercase tracking-wider text-white mb-6">Contact & Location</h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
              <label class="block text-xs font-heading uppercase tracking-widest text-gray-400 mb-2">Business Name</label>
              <input type="text" id="cfg_shopName" class="w-full px-4 py-3 rounded-sm bg-brand-dark border border-brand-cardBorder text-white text-sm" />
            </div>
            <div>
              <label class="block text-xs font-heading uppercase tracking-widest text-gray-400 mb-2">WhatsApp Number</label>
              <input type="text" id="cfg_phone" class="w-full px-4 py-3 rounded-sm bg-brand-dark border border-brand-cardBorder text-white text-sm" />
            </div>
            <div class="md:col-span-2">
              <label class="block text-xs font-heading uppercase tracking-widest text-gray-400 mb-2">Full Address</label>
              <input type="text" id="cfg_address" class="w-full px-4 py-3 rounded-sm bg-brand-dark border border-brand-cardBorder text-white text-sm" />
            </div>
            <div class="md:col-span-2">
              <label class="block text-xs font-heading uppercase tracking-widest text-gray-400 mb-2">Announcement Bar Text</label>
              <input type="text" id="cfg_announcement" class="w-full px-4 py-3 rounded-sm bg-brand-dark border border-brand-cardBorder text-white text-sm" />
            </div>
          </div>
          <div class="mt-6 flex justify-end">
            <button onclick="saveGeneralSettings()" class="px-6 py-2.5 rounded-sm bg-white hover:bg-gray-200 text-black font-heading font-bold text-sm uppercase tracking-widest">
              Save Details
            </button>
          </div>
        </div>
      </div>

      <!-- TAB 2: SERVICES & PRICING -->
      <div id="tab-services" class="tab-content hidden space-y-6">
        <div class="bg-brand-card rounded-sm border border-brand-cardBorder p-6">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h2 class="text-2xl font-heading font-bold uppercase tracking-wider text-white">Services</h2>
            </div>
            <button onclick="addNewServicePrompt()" class="px-4 py-2 rounded-sm bg-white hover:bg-gray-200 text-black font-heading font-bold text-xs uppercase tracking-widest flex items-center gap-1.5">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Service
            </button>
          </div>
          <div id="servicesEditorList" class="space-y-4"></div>
          <div class="mt-6 flex justify-end">
            <button onclick="saveServicesSettings()" class="px-6 py-2.5 rounded-sm bg-white hover:bg-gray-200 text-black font-heading font-bold text-sm uppercase tracking-widest">
              Save Services
            </button>
          </div>
        </div>
      </div>

      <!-- TAB 3: GALLERY PHOTOS -->
      <div id="tab-gallery" class="tab-content hidden space-y-6">
        <div class="bg-brand-card rounded-sm border border-brand-cardBorder p-6">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-heading font-bold uppercase tracking-wider text-white">Gallery</h2>
            <button onclick="addNewPhotoPrompt()" class="px-4 py-2 rounded-sm bg-white hover:bg-gray-200 text-black font-heading font-bold text-xs uppercase tracking-widest flex items-center gap-1.5">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Image
            </button>
          </div>
          <div id="galleryEditorGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
          <div class="mt-6 flex justify-end">
            <button onclick="saveGallerySettings()" class="px-6 py-2.5 rounded-sm bg-white hover:bg-gray-200 text-black font-heading font-bold text-sm uppercase tracking-widest">
              Save Gallery
            </button>
          </div>
        </div>
      </div>

      <!-- TAB 4: OPENING HOURS -->
      <div id="tab-hours" class="tab-content hidden space-y-6">
        <div class="bg-brand-card rounded-sm border border-brand-cardBorder p-6">
          <h2 class="text-2xl font-heading font-bold uppercase tracking-wider text-white mb-6">Hours</h2>
          <div id="hoursEditorGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
          <div class="mt-6 flex justify-end">
            <button onclick="saveHoursSettings()" class="px-6 py-2.5 rounded-sm bg-white hover:bg-gray-200 text-black font-heading font-bold text-sm uppercase tracking-widest">
              Save Hours
            </button>
          </div>
        </div>
      </div>

      <!-- TAB 5: HERO & ABOUT COPY -->
      <div id="tab-content" class="tab-content hidden space-y-6">
        <div class="bg-brand-card rounded-sm border border-brand-cardBorder p-6 space-y-6">
          <h2 class="text-2xl font-heading font-bold uppercase tracking-wider text-white mb-6">Text Content</h2>
          <div class="space-y-4">
            <h3 class="text-sm font-heading font-bold tracking-widest uppercase text-white">Hero Section</h3>
            <div>
              <label class="block text-xs font-heading uppercase tracking-widest text-gray-400 mb-1">Headline</label>
              <input type="text" id="cfg_heroTagline" class="w-full px-4 py-3 rounded-sm bg-brand-dark border border-brand-cardBorder text-white text-sm" />
            </div>
            <div>
              <label class="block text-xs font-heading uppercase tracking-widest text-gray-400 mb-1">Supporting Text</label>
              <textarea id="cfg_heroParagraph" rows="3" class="w-full px-4 py-3 rounded-sm bg-brand-dark border border-brand-cardBorder text-white text-sm"></textarea>
            </div>
          </div>
          <div class="space-y-4 pt-4 border-t border-brand-cardBorder">
            <h3 class="text-sm font-heading font-bold tracking-widest uppercase text-white">About Section</h3>
            <div>
              <label class="block text-xs font-heading uppercase tracking-widest text-gray-400 mb-1">Paragraph 1</label>
              <textarea id="cfg_aboutP1" rows="3" class="w-full px-4 py-3 rounded-sm bg-brand-dark border border-brand-cardBorder text-white text-sm"></textarea>
            </div>
            <div>
              <label class="block text-xs font-heading uppercase tracking-widest text-gray-400 mb-1">Paragraph 2</label>
              <textarea id="cfg_aboutP2" rows="3" class="w-full px-4 py-3 rounded-sm bg-brand-dark border border-brand-cardBorder text-white text-sm"></textarea>
            </div>
          </div>
          <div class="flex justify-end">
            <button onclick="saveCopySettings()" class="px-6 py-2.5 rounded-sm bg-white hover:bg-gray-200 text-black font-heading font-bold text-sm uppercase tracking-widest">
              Save Copy
            </button>
          </div>
        </div>
      </div>

      <!-- TAB 6: SECURITY -->
      <div id="tab-security" class="tab-content hidden space-y-6">
        <div class="bg-brand-card rounded-sm border border-brand-cardBorder p-6 max-w-xl">
          <h2 class="text-2xl font-heading font-bold uppercase tracking-wider text-white mb-6">Security</h2>
          <form onsubmit="handlePasswordChange(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-heading uppercase tracking-widest text-gray-400 mb-1">Current Password</label>
              <input type="password" id="currPassInput" required class="w-full px-4 py-3 rounded-sm bg-brand-dark border border-brand-cardBorder text-white text-sm" />
            </div>
            <div>
              <label class="block text-xs font-heading uppercase tracking-widest text-gray-400 mb-1">New Password</label>
              <input type="password" id="newPassInput" required minlength="5" class="w-full px-4 py-3 rounded-sm bg-brand-dark border border-brand-cardBorder text-white text-sm" />
            </div>
            <button type="submit" class="px-6 py-3 rounded-sm bg-white hover:bg-gray-200 text-black font-heading font-bold text-sm uppercase tracking-widest">
              Update Password
            </button>
          </form>
        </div>
      </div>

      <!-- TAB 7: BACKUP -->
      <div id="tab-backup" class="tab-content hidden space-y-6">
        <div class="bg-brand-card rounded-sm border border-brand-cardBorder p-6 space-y-6">
          <h2 class="text-2xl font-heading font-bold uppercase tracking-wider text-white mb-2">Backup</h2>
          <div class="flex flex-wrap gap-4">
            <button onclick="exportConfigFile()" class="px-5 py-3 rounded-sm bg-brand-card hover:bg-brand-cardBorder border border-brand-cardBorder text-white font-heading font-bold text-sm uppercase tracking-widest flex items-center gap-2">
              <i data-lucide="download" class="w-4 h-4 text-white"></i> Export Config
            </button>
            <label class="px-5 py-3 rounded-sm bg-brand-card hover:bg-brand-cardBorder border border-brand-cardBorder text-white font-heading font-bold text-sm uppercase tracking-widest flex items-center gap-2 cursor-pointer">
              <i data-lucide="upload" class="w-4 h-4 text-white"></i> Import Config
              <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importConfigFile(event)" />
            </label>
            <button onclick="resetToFactoryDefaults()" class="px-5 py-3 rounded-sm bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-red-400 font-heading font-bold text-sm uppercase tracking-widest flex items-center gap-2">
              <i data-lucide="refresh-ccw" class="w-4 h-4"></i> Reset Defaults
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    async function sha256(text) {
      const buffer = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
    const DEFAULT_PASS_HASH = "5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5";

    const INITIAL_CONFIG = {
      shopName: "[Barbershop Name]",
      phone: "+27 82 399 2915",
      address: "17 Anna Marie Drive, Morgenster Shopping Centre, Mitchell's Plain, South Africa",
      announcement: "Now accepting WhatsApp bookings in Mitchell's Plain.",
      heroTagline: "Sharp Cuts. Clean Style. Confidence.",
      heroParagraph: "Professional barbering in Mitchell's Plain. Step in looking good. Walk out feeling even better.",
      aboutP1: "Welcome to our barbershop, where traditional barbering meets modern style. We are dedicated to providing high-quality haircuts, precision grooming, and exceptional customer service in a clean and welcoming environment.",
      aboutP2: "Our commitment is simple: unparalleled attention to detail and absolute customer satisfaction. Relax. Grab a seat. Let us elevate your style.",
      hours: [
        { day: "Monday", time: "08:30 – 18:00" },
        { day: "Tuesday", time: "08:30 – 18:00" },
        { day: "Wednesday", time: "08:30 – 18:00" },
        { day: "Thursday", time: "08:30 – 18:00" },
        { day: "Friday", time: "08:30 – 18:00" },
        { day: "Saturday", time: "08:00 – 17:00" },
        { day: "Sunday", time: "09:00 – 14:00" }
      ],
      services: [
        { id: 1, title: "Haircuts", price: "Price coming soon", desc: "Classic and modern haircuts tailored to your head shape and personal style.", duration: "30 mins" },
        { id: 2, title: "Fades", price: "Price coming soon", desc: "Clean, precise skin fades, taper fades, and burst fades executed with perfection.", duration: "35 mins" },
        { id: 3, title: "Beard Grooming", price: "Price coming soon", desc: "Sculpting, trimming, and hot towel line-ups to keep your beard looking sharp.", duration: "20 mins" },
        { id: 4, title: "Hair & Beard", price: "Price coming soon", desc: "The complete package. A flawless haircut combined with premium beard detailing.", duration: "45 mins" },
        { id: 5, title: "Kids Cuts", price: "Price coming soon", desc: "Patient, stylish, and comfortable haircuts for the younger gentlemen.", duration: "25 mins" },
        { id: 6, title: "Hair Styling", price: "Price coming soon", desc: "Professional washing, blow-drying, and styling using premium products.", duration: "20 mins" }
      ],
      gallery: [
        { id: 1, url: "https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&q=80&w=600", title: "Sharp Fade", tag: "Haircut" },
        { id: 2, url: "https://images.unsplash.com/photo-1622286342621-4bd786c2447c?auto=format&fit=crop&q=80&w=600", title: "Beard Trim", tag: "Grooming" },
        { id: 3, url: "https://images.unsplash.com/photo-1521590838159-edee2ea19413?auto=format&fit=crop&q=80&w=600", title: "Classic Cut", tag: "Style" },
        { id: 4, url: "https://images.unsplash.com/photo-1593702288056-cc581005a5a1?auto=format&fit=crop&q=80&w=600", title: "Line Up", tag: "Precision" }
      ]
    };

    function getConfig() {
      const stored = localStorage.getItem('rajies_barber_data');
      if (!stored) {
        localStorage.setItem('rajies_barber_data', JSON.stringify(INITIAL_CONFIG));
        return INITIAL_CONFIG;
      }
      try { return JSON.parse(stored); } catch (e) { return INITIAL_CONFIG; }
    }

    function saveConfig(data) {
      localStorage.setItem('rajies_barber_data', JSON.stringify(data));
      showToast();
    }

    function showToast() {
      const toast = document.getElementById('saveToast');
      toast.classList.remove('translate-y-24', 'opacity-0');
      setTimeout(() => { toast.classList.add('translate-y-24', 'opacity-0'); }, 2500);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const input = document.getElementById('passwordInput').value;
      const hashedInput = await sha256(input);
      const activeHash = localStorage.getItem('rajies_admin_hash') || DEFAULT_PASS_HASH;
      if (hashedInput === activeHash) {
        sessionStorage.setItem('rajies_authenticated', 'true');
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
        populateAdminFields();
        lucide.createIcons();
      } else { document.getElementById('loginError').classList.remove('hidden'); }
    }

    function handleLogout() {
      sessionStorage.removeItem('rajies_authenticated');
      window.location.reload();
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      if (sessionStorage.getItem('rajies_authenticated') === 'true') {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
        populateAdminFields();
      }
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('bg-white', 'text-black', 'border-transparent');
        b.classList.add('bg-brand-card', 'text-gray-300', 'border-brand-cardBorder');
      });
      const activeContent = document.getElementById(tabId);
      const activeBtn = document.querySelector(`[data-tab="${tabId}"]`);
      if (activeContent) activeContent.classList.remove('hidden');
      if (activeBtn) {
        activeBtn.classList.remove('bg-brand-card', 'text-gray-300', 'border-brand-cardBorder');
        activeBtn.classList.add('bg-white', 'text-black', 'border-transparent');
      }
    }

    function populateAdminFields() {
      const cfg = getConfig();
      document.getElementById('cfg_shopName').value = cfg.shopName || '';
      document.getElementById('cfg_phone').value = cfg.phone || '';
      document.getElementById('cfg_address').value = cfg.address || '';
      document.getElementById('cfg_announcement').value = cfg.announcement || '';
      document.getElementById('cfg_heroTagline').value = cfg.heroTagline || '';
      document.getElementById('cfg_heroParagraph').value = cfg.heroParagraph || '';
      document.getElementById('cfg_aboutP1').value = cfg.aboutP1 || '';
      document.getElementById('cfg_aboutP2').value = cfg.aboutP2 || '';
      renderServicesList(cfg.services || []);
      renderGalleryGrid(cfg.gallery || []);
      renderHoursGrid(cfg.hours || []);
    }

    function renderServicesList(services) {
      const container = document.getElementById('servicesEditorList');
      container.innerHTML = services.map((s, idx) => `
        <div class="p-4 rounded-sm bg-brand-dark border border-brand-cardBorder grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
          <div class="md:col-span-3">
            <label class="text-[10px] uppercase font-bold text-gray-500">Service</label>
            <input type="text" value="${s.title}" class="srv-title w-full px-3 py-2 rounded-sm bg-black border border-brand-cardBorder text-white text-xs" />
          </div>
          <div class="md:col-span-3">
            <label class="text-[10px] uppercase font-bold text-gray-500">Price</label>
            <input type="text" value="${s.price}" class="srv-price w-full px-3 py-2 rounded-sm bg-black border border-brand-cardBorder text-white text-xs font-mono" />
          </div>
          <div class="md:col-span-2">
            <label class="text-[10px] uppercase font-bold text-gray-500">Duration</label>
            <input type="text" value="${s.duration}" class="srv-duration w-full px-3 py-2 rounded-sm bg-black border border-brand-cardBorder text-white text-xs" />
          </div>
          <div class="md:col-span-3">
            <label class="text-[10px] uppercase font-bold text-gray-500">Description</label>
            <input type="text" value="${s.desc}" class="srv-desc w-full px-3 py-2 rounded-sm bg-black border border-brand-cardBorder text-gray-300 text-xs" />
          </div>
          <div class="md:col-span-1 flex items-end justify-center pt-3 md:pt-0">
            <button onclick="removeService(${idx})" class="p-2 text-gray-500 hover:text-white transition-colors" title="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }
    function addNewServicePrompt() {
      const cfg = getConfig();
      cfg.services.push({ id: Date.now(), title: "New Service", price: "Price coming soon", desc: "Description.", duration: "30 mins" });
      saveConfig(cfg); renderServicesList(cfg.services);
    }
    function removeService(index) {
      const cfg = getConfig(); cfg.services.splice(index, 1);
      saveConfig(cfg); renderServicesList(cfg.services);
    }
    function saveServicesSettings() {
      const cfg = getConfig();
      const titles = document.querySelectorAll('.srv-title');
      const prices = document.querySelectorAll('.srv-price');
      const durations = document.querySelectorAll('.srv-duration');
      const descs = document.querySelectorAll('.srv-desc');
      cfg.services = Array.from(titles).map((t, idx) => ({
        id: cfg.services[idx]?.id || Date.now() + idx,
        title: t.value.trim(), price: prices[idx].value.trim(), duration: durations[idx].value.trim(), desc: descs[idx].value.trim()
      }));
      saveConfig(cfg);
    }

    function renderGalleryGrid(gallery) {
      const container = document.getElementById('galleryEditorGrid');
      container.innerHTML = gallery.map((item, idx) => `
        <div class="p-3 rounded-sm bg-brand-dark border border-brand-cardBorder flex flex-col justify-between">
          <img src="${item.url}" class="h-32 w-full object-cover rounded-sm mb-2 border border-brand-cardBorder grayscale" onerror="this.src='https://via.placeholder.com/300?text=Image'" />
          <div class="space-y-2">
            <label class="block cursor-pointer">
              <input type="file" accept="image/*" onchange="convertImageToBase64(this, ${idx})" class="block w-full text-[10px] text-gray-400 file:mr-2 file:py-1 file:px-2 file:rounded-sm file:border-0 file:bg-white file:text-black hover:file:bg-gray-200 transition-all"/>
            </label>
            <input type="text" value="${item.url}" placeholder="URL" class="gal-url w-full px-2 py-1.5 rounded-sm bg-black border border-brand-cardBorder text-white text-[11px]" />
            <input type="text" value="${item.title}" placeholder="Title" class="gal-title w-full px-2 py-1.5 rounded-sm bg-black border border-brand-cardBorder text-white text-[11px]" />
            <input type="text" value="${item.tag}" placeholder="Tag" class="gal-tag w-full px-2 py-1.5 rounded-sm bg-black border border-brand-cardBorder text-white text-[11px]" />
          </div>
          <button onclick="removeGalleryPhoto(${idx})" class="mt-3 w-full py-1.5 rounded-sm bg-red-500/10 text-red-400 hover:bg-red-500/20 text-[11px] font-bold uppercase tracking-wider flex items-center justify-center gap-1"><i data-lucide="trash" class="w-3 h-3"></i> Delete</button>
        </div>
      `).join('');
      lucide.createIcons();
    }
    function addNewPhotoPrompt() {
      const cfg = getConfig();
      cfg.gallery.push({ id: Date.now(), url: "https://images.unsplash.com/photo-1599351431202-1e0f0137899a", title: "New Photo", tag: "Gallery" });
      saveConfig(cfg); renderGalleryGrid(cfg.gallery);
    }
    function removeGalleryPhoto(idx) {
      const cfg = getConfig(); cfg.gallery.splice(idx, 1);
      saveConfig(cfg); renderGalleryGrid(cfg.gallery);
    }
    function saveGallerySettings() {
      const cfg = getConfig();
      const urls = document.querySelectorAll('.gal-url');
      const titles = document.querySelectorAll('.gal-title');
      const tags = document.querySelectorAll('.gal-tag');
      cfg.gallery = Array.from(urls).map((u, idx) => ({
        id: cfg.gallery[idx]?.id || Date.now() + idx, url: u.value.trim(), title: titles[idx].value.trim(), tag: tags[idx].value.trim()
      }));
      saveConfig(cfg);
    }
    function convertImageToBase64(fileInput, idx) {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX = 800; let w = img.width; let h = img.height;
          if (w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          document.querySelectorAll('.gal-url')[idx].value = dataUrl;
          document.querySelectorAll('#galleryEditorGrid img')[idx].src = dataUrl;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderHoursGrid(hours) {
      const container = document.getElementById('hoursEditorGrid');
      container.innerHTML = hours.map((h, idx) => `
        <div class="flex items-center gap-3 p-3 rounded-sm bg-brand-dark border border-brand-cardBorder">
          <input type="text" value="${h.day}" class="hour-day w-1/3 px-3 py-2 rounded-sm bg-black border border-brand-cardBorder text-white text-xs font-mono" />
          <input type="text" value="${h.time}" class="hour-time flex-1 px-3 py-2 rounded-sm bg-black border border-brand-cardBorder text-white text-xs font-mono" />
        </div>
      `).join('');
    }
    function saveHoursSettings() {
      const cfg = getConfig();
      const days = document.querySelectorAll('.hour-day');
      const times = document.querySelectorAll('.hour-time');
      cfg.hours = Array.from(days).map((d, idx) => ({ day: d.value.trim(), time: times[idx].value.trim() }));
      saveConfig(cfg);
    }

    function saveGeneralSettings() {
      const cfg = getConfig();
      cfg.shopName = document.getElementById('cfg_shopName').value.trim();
      cfg.phone = document.getElementById('cfg_phone').value.trim();
      cfg.address = document.getElementById('cfg_address').value.trim();
      cfg.announcement = document.getElementById('cfg_announcement').value.trim();
      saveConfig(cfg);
    }
    function saveCopySettings() {
      const cfg = getConfig();
      cfg.heroTagline = document.getElementById('cfg_heroTagline').value.trim();
      cfg.heroParagraph = document.getElementById('cfg_heroParagraph').value.trim();
      cfg.aboutP1 = document.getElementById('cfg_aboutP1').value.trim();
      cfg.aboutP2 = document.getElementById('cfg_aboutP2').value.trim();
      saveConfig(cfg);
    }

    async function handlePasswordChange(e) {
      e.preventDefault();
      const currPass = document.getElementById('currPassInput').value;
      const newPass = document.getElementById('newPassInput').value;
      const hashedCurrent = await sha256(currPass);
      const activeHash = localStorage.getItem('rajies_admin_hash') || DEFAULT_PASS_HASH;
      if (hashedCurrent !== activeHash) { alert("Incorrect current password."); return; }
      const hashedNew = await sha256(newPass);
      localStorage.setItem('rajies_admin_hash', hashedNew);
      alert("Password changed successfully!");
      document.getElementById('currPassInput').value = ''; document.getElementById('newPassInput').value = '';
    }

    function exportConfigFile() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(getConfig(), null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr); downloadAnchor.setAttribute("download", "sharp_style_config.json");
      document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
    }
    function importConfigFile(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && typeof parsed === 'object') { saveConfig(parsed); populateAdminFields(); alert("Configuration restored!"); }
        } catch (err) { alert("Invalid file."); }
      };
      reader.readAsText(file);
    }
    function resetToFactoryDefaults() {
      if (confirm("Reset all settings to original defaults?")) {
        localStorage.removeItem('rajies_barber_data'); populateAdminFields(); showToast();
      }
    }
  </script>
</body>
</html>
